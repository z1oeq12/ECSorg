name: Build Roblox.Website for Linux ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: .NET 6 SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Projeyi Linux ARM64 Olarak Derle
        run: |
          cd services/Roblox/Roblox.Website
          dotnet publish -c Release -r linux-arm64 --self-contained false -o ./publish

      - name: Çıktıyı İndirilebilir Paket Yap
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Website-ARM64
          path: services/Roblox/Roblox.Website/pu
          blish
