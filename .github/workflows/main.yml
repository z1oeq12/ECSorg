name: Build Roblox Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Publish project
        run: dotnet publish services/Roblox/Roblox.Website -c Release -r linux-arm64 --self-contained false -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Website-ARM64
          path: ./publish
